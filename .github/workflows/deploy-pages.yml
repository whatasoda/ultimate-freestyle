name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore the latest generated audio
        uses: actions/cache/restore@v4
        with:
          path: .voicevox-cache
          key: voicevox-mp3-${{ runner.os }}-deploy-${{ github.run_id }}
          restore-keys: |
            voicevox-mp3-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Select audio matching the current narration
        id: audio
        run: bun run voicevox:sync

      - name: Build static site
        run: bun run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_USE_GENERATED_AUDIO: ${{ steps.audio.outputs.count != '0' }}
          NEXT_PUBLIC_GENERATED_AUDIO_ROOT: /researches

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
