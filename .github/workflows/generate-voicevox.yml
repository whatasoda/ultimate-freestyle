name: Generate VOICEVOX audio

run-name: Generate VOICEVOX audio for ${{ inputs.slug || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Research slug, or "all"
        required: true
        default: all
        type: string
      speaker:
        description: VOICEVOX speaker name
        required: true
        default: ずんだもん
        type: string
      style:
        description: VOICEVOX style name
        required: true
        default: ノーマル
        type: string
      regenerate_all:
        description: Ignore the MP3 cache and regenerate selected segments
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "voice-*"

permissions:
  contents: read

concurrency:
  group: voicevox-audio
  cancel-in-progress: false

env:
  VOICEVOX_IMAGE: voicevox/voicevox_engine:cpu-latest
  VOICEVOX_URL: http://127.0.0.1:50021
  VOICEVOX_OUTPUT_ROOT: .voicevox-cache/researches
  VOICEVOX_MP3_BITRATE: 64
  RESEARCH_SLUG: ${{ inputs.slug || 'all' }}
  VOICEVOX_SPEAKER: ${{ inputs.speaker || 'ずんだもん' }}
  VOICEVOX_STYLE: ${{ inputs.style || 'ノーマル' }}
  REGENERATE_ALL: ${{ inputs.regenerate_all || false }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore generated audio cache
        uses: actions/cache@v4
        with:
          path: .voicevox-cache
          key: voicevox-mp3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            voicevox-mp3-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version

      - name: Start VOICEVOX ENGINE
        run: >-
          docker run --detach --rm --name voicevox
          --publish 127.0.0.1:50021:50021
          "$VOICEVOX_IMAGE"

      - name: Wait for VOICEVOX ENGINE
        run: |
          for _ in {1..90}; do
            if curl --fail --silent "$VOICEVOX_URL/version"; then
              exit 0
            fi
            sleep 2
          done
          docker logs voicevox
          exit 1

      - name: Record immutable ENGINE image identity
        run: |
          digest=$(docker image inspect "$VOICEVOX_IMAGE" --format '{{ index .RepoDigests 0 }}')
          if [[ -z "$digest" || "$digest" != *@sha256:* ]]; then
            echo "Unable to resolve the VOICEVOX image digest." >&2
            exit 1
          fi
          echo "VOICEVOX_ENGINE_IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Generate changed MP3 audio
        run: |
          arguments=()
          if [[ "$RESEARCH_SLUG" == "all" ]]; then
            arguments+=(--all)
          else
            arguments+=("$RESEARCH_SLUG")
          fi
          if [[ "$REGENERATE_ALL" == "true" ]]; then
            arguments+=(--force)
          fi
          bun run voicevox:generate -- "${arguments[@]}"

      - name: Stop VOICEVOX ENGINE
        if: always()
        run: docker stop voicevox || true

      - name: Record generation summary
        run: |
          {
            echo "## VOICEVOX MP3 publication"
            echo "- Engine: $(docker image inspect "$VOICEVOX_IMAGE" --format '{{ index .RepoDigests 0 }}')"
            echo "- Research: $RESEARCH_SLUG"
            echo "- Legacy deck fallback: $VOICEVOX_SPEAKER / $VOICEVOX_STYLE"
            echo "- Profile-based decks use their speaker UUID, style ID, and tuning settings."
            echo "- MP3 bitrate: ${VOICEVOX_MP3_BITRATE}kbps mono"
            echo "- Output is retained as a review artifact for 7 days."
            echo "- This workflow does not deploy the production Worker or GitHub Pages."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated MP3 for review
        uses: actions/upload-artifact@v4
        with:
          name: voicevox-mp3-${{ github.ref_name }}
          path: .voicevox-cache/researches/*/audio/*.mp3
          if-no-files-found: error
          retention-days: 7
