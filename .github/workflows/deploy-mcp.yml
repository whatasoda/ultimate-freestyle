name: Deploy Remote MCP to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, migrate, deploy, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MCP_BASE_URL: https://saijiyu-kenkyu.2764.moe
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Validate deployment credentials
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::GitHub Actions variable CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Validate Remote MCP
        run: bun run test:mcp

      # Workerを先にdeployすると、新コードが未適用schemaを参照し得る。
      - name: Apply pending D1 migrations
        run: bun run migrate:mcp

      - name: Deploy Remote MCP
        run: bun run deploy:mcp

      - name: Verify production
        run: bun run smoke:mcp

      - name: Record deployment summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Cloudflare production deployment"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Worker: \`ultimate-freestyle-mcp\`"
            echo "- URL: https://saijiyu-kenkyu.2764.moe"
            echo "- D1 migrations, Worker and VOICEVOX Container deployment, and production smoke test completed."
          } >> "$GITHUB_STEP_SUMMARY"
